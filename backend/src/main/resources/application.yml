spring:
  application:
    name: joblens-backend
  config:
    import:
      - "optional:file:./profile/candidate-profile.yml"
      - "classpath:jev-questions.yml"
  threads:
    virtual:
      # Outbound calls to Jev and the LLM are blocking; virtual threads keep request-handling
      # capacity from being limited by the platform thread pool while those calls are in flight.
      enabled: true
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s
  ai:
    openai:
      # Real key comes from the OPENROUTER_API_KEY env var (never committed) - a key from
      # openrouter.ai/keys. The placeholder keeps startup working when joblens.ai.enabled=false
      # and no key is configured at all.
      api-key: ${OPENROUTER_API_KEY:not-configured}

      # OpenRouter exposes an OpenAI-compatible endpoint - spring-ai-starter-model-openai talks
      # to it directly, no relay involved. Its Java SDK requires the full path including /v1.
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

      chat:
        options:
          # liquid/lfm-2.5-2.6b:free - switched from z-ai/glm-5.2:free, which stayed
          # 429 "temporarily rate-limited upstream" (shared free-pool overload) across 12
          # retries spanning a minute of live testing. This id responded immediately in the
          # same test. Free-tier models rotate and any of them can hit the same shared-pool
          # overload later; re-verify against openrouter.ai/api/v1/models if this 404s or
          # starts 429ing persistently too.
          model: ${OPENROUTER_MODEL:liquid/lfm-2.5-2.6b:free}

joblens:
  gate:
    max-red-flag-score: 1.5
  cache:
    max-size: 1000
    expire-after-write: 24h
  rate-limit:
    enabled: true
    requests-per-minute: 60
  security:
    api-key:
      # Turn on once the extension has a real key configured (see its options page) - see
      # SecurityProperties/ADR-0005 for why this defaults off, same as ai.enabled/jev.enabled.
      enabled: false
      valid-keys: []
    # e.g. chrome-extension://<your-extension-id> once you've loaded the built extension.
    # Empty means no CORS headers are sent at all, so browsers block cross-origin calls.
    allowed-origins:
      - "chrome-extension://mhclalkmenkeffnnmgghaokceahgelmd"
    max-request-body-size: 50KB
  ai:
    # Real talking points require ANTHROPIC_API_KEY and cost real money. Defaults to true as of
    # ADR-0011 (live-testing session with real provider keys) - set to false, or override with
    # JOBLENS_AI_ENABLED=false, to fall back to the offline StubTalkingPointsWriter - see
    # ADR-0003/ADR-0011/CLAUDE.md.
    enabled: true
  jev:
    # Real classification calls Jev and costs money. Defaults to true as of ADR-0011
    # (live-testing session with real provider keys) - set to false, or override with
    # JOBLENS_JEV_ENABLED=false, to fall back to the offline MockPostingClassifier - see
    # ADR-0003/ADR-0011/CLAUDE.md.
    enabled: true
    base-url: https://api.typesafe.ai/v1
    # Real key comes from the JEV_API_KEY env var (never committed). The placeholder keeps
    # startup working when joblens.jev.enabled=false and no key is configured at all.
    api-key: ${JEV_API_KEY:not-configured}
    model: jev-latest
  thresholds:
    # Applied to whichever probability/confidence a classifier reports - "high"/"middle" from
    # the brief. confidentAt is inclusive-and-above; uncertainAt is inclusive-and-above, below
    # confidentAt; anything lower is Ignored.
    confident-at: 0.8
    uncertain-at: 0.4
  resilience:
    # Both blocks are always bound at startup regardless of which classifier/writer bean is
    # active (joblens.ai.enabled / joblens.jev.enabled), since @ConfigurationProperties binds
    # eagerly either way.
    talking-points:
      retry-max-attempts: 3
      retry-wait-duration: 500ms
      circuit-breaker-sliding-window-size: 10
      circuit-breaker-minimum-calls: 5
      circuit-breaker-failure-rate-threshold: 50
      circuit-breaker-wait-duration-in-open-state: 30s
    jev:
      # Exponential backoff per Jev's own API guidance (see ADR-0005).
      retry-max-attempts: 3
      retry-initial-interval: 500ms
      retry-backoff-multiplier: 2.0
      circuit-breaker-sliding-window-size: 10
      circuit-breaker-minimum-calls: 5
      circuit-breaker-failure-rate-threshold: 50
      circuit-breaker-wait-duration-in-open-state: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
